name: Release Builds

on:
  push:
    branches: [ "releases" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build macOS release package
        run: ./gradlew :desktopApp:packageReleaseDistributionForCurrentOS

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrossSync-macOS-dmg
          path: desktopApp/build/compose/binaries/main-release/dmg/*.dmg
          if-no-files-found: error

  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android release APK
        run: ./gradlew :androidApp:assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrossSync-android-apk
          path: androidApp/build/outputs/apk/release/*.apk
          if-no-files-found: error
